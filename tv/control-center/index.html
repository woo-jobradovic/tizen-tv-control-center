<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TV Control Center</title>
<style>
:root {
  --text-primary: #fff;
  --text-secondary: rgba(255,255,255,0.55);
  color-scheme: dark;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'SamsungOne', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  width: 100vw; height: 100vh; overflow: hidden;
  background: #000; color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* WALLPAPER — static image, zero GPU cost */
.wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background: url('wallpaper.jpg') center/cover no-repeat;
}
.wallpaper-dim {
  position: fixed; inset: 0; z-index: 1;
  background: rgba(0,0,0,0.15);
}
.screen {
  position: relative; z-index: 2;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

/* TIME */
.time-section {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding-bottom: 40px;
}
.time-display {
  text-align: center;
  text-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.time {
  font-size: 160px;
  font-weight: 200;
  letter-spacing: -4px;
  line-height: 1;
  color: rgba(255,255,255,0.92);
}
.date {
  font-size: 28px;
  font-weight: 400;
  color: rgba(255,255,255,0.65);
  margin-top: 8px;
  letter-spacing: 0.5px;
}

/* DOCK BAR — pre-baked glass (NO backdrop-filter) */
.dock-wrap {
  padding: 0 0 36px;
  display: flex; justify-content: center;
}
.dock-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 28px;
  background: linear-gradient(
    135deg,
    rgba(180,170,160,0.28) 0%,
    rgba(140,135,150,0.22) 50%,
    rgba(160,155,165,0.26) 100%
  );
  border: 0.5px solid rgba(255,255,255,0.30);
  border-top-color: rgba(255,255,255,0.45);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.20),
    inset 0 -1px 1px rgba(255,255,255,0.05),
    0 8px 32px rgba(0,0,0,0.25),
    0 2px 8px rgba(0,0,0,0.15);
  border-radius: 36px;
}
.dock-divider {
  width: 1.5px;
  height: 70px;
  background: rgba(255,255,255,0.25);
  margin: 0 12px;
  flex-shrink: 0;
}
*:focus, *:focus-visible, *:active {
  outline: none !important;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-focus-ring-color: transparent !important;
}
.dock-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
  outline: none !important;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  background: transparent;
  border: 1px solid transparent;
  -webkit-transform: translateZ(0) scale(1);
  transform: translateZ(0) scale(1);
  -webkit-transition: -webkit-transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}
.dock-app:focus,
.dock-app:focus-visible,
.dock-app:active {
  outline: none !important;
}
.dock-app.focused {
  -webkit-transform: translateZ(0) scale(1.08);
  transform: translateZ(0) scale(1.08);
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.25);
  will-change: transform;
}
.dock-app.focused .app-label {
  color: #fff;
}
.dock-icon {
  width: 86px;
  height: 86px;
  border-radius: 18px;
  object-fit: cover;
}
.app-label {
  font-size: 15px;
  font-weight: 500;
  color: rgba(255,255,255,0.8);
  white-space: nowrap;
}

/* ORDER NOTIFICATION — matches dock bar glass style */
.notification {
  position: fixed;
  top: 40px; left: 50%;
  -webkit-transform: translateX(-50%) translateY(-140px);
  transform: translateX(-50%) translateY(-140px);
  background: linear-gradient(
    135deg,
    rgba(180,170,160,0.28) 0%,
    rgba(140,135,150,0.22) 50%,
    rgba(160,155,165,0.26) 100%
  );
  border: 0.5px solid rgba(255,255,255,0.30);
  border-top-color: rgba(255,255,255,0.45);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.20),
    inset 0 -1px 1px rgba(255,255,255,0.05),
    0 8px 32px rgba(0,0,0,0.25),
    0 2px 8px rgba(0,0,0,0.15);
  border-radius: 36px;
  padding: 20px 36px;
  display: flex; align-items: center; gap: 18px;
  z-index: 100;
  -webkit-transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
.notification.show {
  -webkit-transform: translateX(-50%) translateY(0);
  transform: translateX(-50%) translateY(0);
}
.notif-icon {
  flex-shrink: 0;
  width: 48px; height: 48px;
}
.notif-body {
  display: flex; flex-direction: column; gap: 2px;
}
.notif-title {
  font-size: 22px; font-weight: 600;
  color: rgba(255,255,255,0.95);
}
.notif-msg {
  font-size: 18px; color: rgba(255,255,255,0.6);
}
</style>
</head>

<div class="notification" id="notif">
  <img class="notif-icon" id="notifIcon" src="cc-order.png" alt="">
  <div class="notif-body">
    <span class="notif-title" id="notifTitle"></span>
    <span class="notif-msg" id="notifMsg"></span>
  </div>
</div>

<script>
var lastOrderId = 0;
var lastWasherState = '';
var lastDishwasherState = '';
var notiSound = new Audio('noti.wav');

// Register system keys so CC can receive them
var sysKeys = ['XF86KeySweetTV','XF86KeyTVPlus','XF86KeyYouTube','XF86KeyAod',
  'XF86KeyAmbientLong','XF86Exit','XF86Back','XF86KeyAIMenu','XF86KeyQuickSetting'];
if(typeof tizen!=='undefined' && tizen.inputdevice){
  for(var ki=0;ki<sysKeys.length;ki++){
    try{ tizen.inputdevice.registerKey(sysKeys[ki]); }catch(ek){}
  }
}

function launchById(appId){
  if(typeof tizen==='undefined'||!tizen.filesystem) return;
  try{
    var fh=tizen.filesystem.openFile('wgt-private/cc_launch','w');
    fh.writeString(appId);
    fh.close();
  }catch(e){}
}

function writeFile(name,content){
  if(typeof tizen==='undefined'||!tizen.filesystem) return;
  try{
    var fh=tizen.filesystem.openFile('wgt-private/'+name,'w');
    fh.writeString(content);
    fh.close();
  }catch(e){}
}

// While another app is on screen cc-notifywake wakes this page in the background when the data
// changes. The web runtime has no tizen.notification, so the message is queued in cc_native
// ("title|message|icon" lines) and the daemon posts it as a native Samsung notification,
// with the matching icon from shared/res. Icons are named order, washer, dishwasher or bell; the
// home-screen banner uses the same PNGs (cc-<icon>.png, copied next to this page).
function queueNative(title, msg, icon){
  if(typeof tizen==='undefined'||!tizen.filesystem) return false;
  function clean(s){ return String(s).replace(/[|\r\n]+/g,' '); }
  var line=clean(title)+'|'+clean(msg)+'|'+icon;
  writeFile('cc_native', (readFile('cc_native')||'')+line+'\n');
  return true;
}

// A background wake leaves document.hidden false, so cc-notifywake also writes the app on screen to cc_fg.
function ccInBackground(){
  if(document.hidden) return true;
  var fg=readFile('cc_fg');
  return !!(fg && fg.indexOf('ClaudeTVCC0')<0);
}

function showNotification(title, msg, duration, icon){
  if(!/^(order|washer|dishwasher|bell)$/.test(icon)) icon='bell';
  if(ccInBackground() && queueNative(title, msg, icon)) return;
  var n=document.getElementById('notif');
  document.getElementById('notifIcon').src='cc-'+icon+'.png';
  document.getElementById('notifTitle').textContent=title;
  document.getElementById('notifMsg').textContent=msg;
  n.classList.add('show');
  try{ notiSound.play(); }catch(e){}
  setTimeout(function(){n.classList.remove('show');}, duration||4000);
}

// Writes the time (ms) of the first frame drawn after the page comes on screen to cc_painted;
// cc-launchtime.awk compares it with the launch request to time Home -> Control Center.
function markPainted(){
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ writeFile('cc_painted', String(Date.now())); }); });
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden) markPainted(); });
markPainted();

function launchApp(el){
  var appId=el.dataset.app;
  if(!appId)return;
  launchById(appId);
}

function readFile(name){
  if(typeof tizen==='undefined'||!tizen.filesystem) return null;
  try{
    var fh=tizen.filesystem.openFile('wgt-private/'+name,'r');
    var txt=fh.readString();
    fh.close();
    return txt||null;
  }catch(e){ return null; }
}

// Last-seen state survives a page restart, so a wake that starts CC fresh still notifies.
function loadSeen(){
  try{
    var s=JSON.parse(readFile('cc_seen'));
    lastOrderId=s.o||0; lastWasherState=s.w||''; lastDishwasherState=s.d||'';
  }catch(e){}
}
function saveSeen(){
  writeFile('cc_seen', JSON.stringify({o:lastOrderId, w:lastWasherState, d:lastDishwasherState}));
}

// cc_push: "title|message" lines any daemon can append.
function checkPush(){
  var txt=readFile('cc_push');
  if(!txt||!txt.trim()) return;
  writeFile('cc_push','');
  txt.trim().split('\n').forEach(function(line, i){
    var p=line.split('|');
    if(p[0]) setTimeout(function(){ showNotification(p[0], p[1]||'', 6000, 'bell'); }, document.hidden ? 0 : i*6500);
  });
}

function checkOrders(){
  var txt=readFile('cc_orders.json');
  if(!txt) return;
  try{
    var d=JSON.parse(txt);
    if(d.id && d.id > lastOrderId){
      if(lastOrderId > 0){
        showNotification(
          'New order from '+d.name,
          '$'+d.total+' \u00b7 '+d.items+' item'+(d.items>1?'s':'')+' \u00b7 #'+d.id,
          6000, 'order'
        );
      }
      lastOrderId = d.id;
      saveSeen();
    }
  }catch(e){}
}

function checkAppliances(){
  var txt=readFile('cc_appliances.json');
  if(!txt) return;
  try{
    var arr=JSON.parse(txt);
    var before=lastWasherState+'|'+lastDishwasherState;
    for(var i=0;i<arr.length;i++){
      var a=arr[i];
      if(a.type==='washer'){
        if(lastWasherState==='Run' && a.state==='Finished'){
          showNotification('Your laundry is done','The washing machine has finished',8000,'washer');
        }
        lastWasherState=a.state;
      }
      if(a.type==='dishwasher'){
        if(lastDishwasherState==='Run' && a.state==='Finished'){
          showNotification('The dishes are clean','The dishwasher has finished',8000,'dishwasher');
        }
        lastDishwasherState=a.state;
      }
    }
    if(lastWasherState+'|'+lastDishwasherState !== before) saveSeen();
  }catch(e){}
}

function updateClock(){
  if(document.hidden)return;
  var now=new Date();
  var h=now.getHours();
  var m=now.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var h12=h%12||12;
  document.getElementById('time').textContent=
    h12+':'+(m<10?'0':'')+m+' '+ampm;
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('date').textContent=
    days[now.getDay()]+', '+months[now.getMonth()]+' '+now.getDate();
}

var dockApps = [];
var focusIdx = -1;

function initNav(){
  dockApps = Array.prototype.slice.call(document.querySelectorAll('.dock-app'));
  if(dockApps.length > 0) setFocus(0);
}

function setFocus(idx){
  if(idx < 0 || idx >= dockApps.length) return;
  if(focusIdx >= 0 && focusIdx < dockApps.length){
    dockApps[focusIdx].classList.remove('focused');
  }
  focusIdx = idx;
  dockApps[focusIdx].classList.add('focused');
}

document.addEventListener('keydown', function(e){
  var code = e.keyCode;
  var key = e.key || '';
  // Log all key events for debugging (written to file, daemon reads it)
  writeFile('cc_keylog', Date.now()+' code='+code+' key='+key);
  switch(code){
    case 37:
      e.preventDefault();
      if(focusIdx > 0) setFocus(focusIdx - 1);
      break;
    case 39:
      e.preventDefault();
      if(focusIdx < dockApps.length - 1) setFocus(focusIdx + 1);
      else if(focusIdx === -1 && dockApps.length > 0) setFocus(0);
      break;
    case 38:
      e.preventDefault();
      break;
    case 40:
      e.preventDefault();
      if(focusIdx === -1 && dockApps.length > 0) setFocus(0);
      break;
    case 13:
      e.preventDefault();
      if(focusIdx >= 0 && focusIdx < dockApps.length){
        launchApp(dockApps[focusIdx]);
      }
      break;
    case 10009:
      e.preventDefault();
      break;
    default:
      // Sweet TV / TV Plus key → launch HBO Max
      if(key==='XF86KeySweetTV'||key==='XF86KeyTVPlus'||code===10228||code===10230){
        e.preventDefault();
        launchById('5b8c3eb16b.BeamCTVDev');
      }
      // YouTube key → launch YouTube
      if(key==='XF86KeyYouTube'||code===10232){
        e.preventDefault();
        launchById('9Ur5IzDKqV.TizenYouTube');
      }
      break;
  }
});

document.addEventListener('visibilitychange', function(){
  if(!document.hidden){
    updateClock();
    checkOrders();
    checkAppliances();
    checkPush();
  }
});

updateClock();
setInterval(updateClock, 30000);
loadSeen();
checkOrders();
checkAppliances();
checkPush();
setInterval(function(){ checkOrders(); checkAppliances(); checkPush(); }, 5000);
initNav();
</script>
</body>
</html>
